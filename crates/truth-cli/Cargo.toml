[package]
name = "truth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "truth"
path = "src/main.rs"

[dependencies]
truth-core.workspace = true
truth-db.workspace = true
truth-indexer.workspace = true
truth-logs.workspace = true
truth-llm.workspace = true
truth-git.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
chrono.workspace = true
rusqlite.workspace = true
ureq.workspace = true
dhat = { version = "0.3", optional = true }

[features]
# Heap profiling: build with `--features dhat-heap` and set TRUTH_PROFILE_HEAP=1.
dhat-heap = ["dep:dhat"]
