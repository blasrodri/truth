name: release

# Build cross-platform binaries and attach them to the GitHub release when a
# v* tag is pushed. Users can then download truth / truth-mcp without a Rust
# toolchain.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          dist="truth-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/truth" "$dist/"
          cp "target/${{ matrix.target }}/release/truth-mcp" "$dist/"
          cp README.md LICENSE* "$dist/" 2>/dev/null || true
          tar -czf "$dist.tar.gz" "$dist"
          # checksum
          if command -v shasum >/dev/null; then
            shasum -a 256 "$dist.tar.gz" > "$dist.tar.gz.sha256"
          else
            sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            truth-*.tar.gz
            truth-*.tar.gz.sha256
