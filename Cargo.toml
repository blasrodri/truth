[workspace]
resolver = "2"
members = [
    "crates/truth-core",
    "crates/truth-db",
    "crates/truth-indexer",
    "crates/truth-logs",
    "crates/truth-llm",
    "crates/truth-git",
    "crates/truth-ast",
    "crates/truth-cli",
    "crates/truth-mcp",
]

[workspace.package]
version = "0.3.5"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blasrodri/truth"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
walkdir = "2"
ignore = "0.4"
rayon = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }

# Local crates
truth-core = { path = "crates/truth-core" }
truth-db = { path = "crates/truth-db" }
truth-indexer = { path = "crates/truth-indexer" }
truth-logs = { path = "crates/truth-logs" }
truth-llm = { path = "crates/truth-llm" }
truth-git = { path = "crates/truth-git" }
truth-ast = { path = "crates/truth-ast" }
truth-cli = { path = "crates/truth-cli" }
